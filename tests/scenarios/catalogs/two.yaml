providers:
  - provider: { name: cat-a, summary: From the catalogue file. }
    resources:
      - key: weather
        kind: mcp_server
        name: weather-a
        summary: Weather from catalogue entry A, renamed.
        interfaces: [{ protocol: mcp-streamable-http, url: "https://a.example/mcp" }]
        pricing: { free: true }
        access: { visibility: public }
  - provider: { name: cat-b, summary: Added on reload. }
    resources:
      - key: weather
        kind: mcp_server
        name: weather-b
        summary: Weather from catalogue entry B.
        interfaces: [{ protocol: mcp-streamable-http, url: "https://b.example/mcp" }]
        pricing: { free: true }
        access: { visibility: public }
