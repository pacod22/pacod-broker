# A workstation serving an embedding model with Ollama; its inventory is for signed-in callers.
ttl_s: 3
provider:
  name: template
  summary: A workstation with one RTX 4090.
  inventory:
    visibility: platform
    hardware:
      - { id: gpu, type: gpu, vendor: nvidia, model: RTX-4090, count: 1, memory_gb: 24 }
    software:
      - { id: ollama, kind: serving_engine, name: ollama, version: "0.5.7" }
resources:
  - key: embed
    kind: embedding
    name: bge-m3
    summary: BGE-M3 embeddings on a workstation.
    interfaces:
      - { protocol: openai-chat, url: "http://workstation.lan:11434/v1" }
    capabilities: { embeddings: true }
    runs_on: { hardware: [gpu], software: [ollama] }
    pricing: { free: true }
    access: { visibility: public }
