[project]
name = "pacod-broker-client"
version = "0.1.0"
description = "Python client of pacod-broker: a provider that announces and keeps its lease alive, a consumer that discovers, watches and reports; and the pacod-broker command line."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.scripts]
pacod-broker = "pacod_broker.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pacod_broker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
