# An announcement, as a provider sends it (PUT /v1/announce): one provider and its resources.
# Every client announces from a file like this one and keeps the lease alive:
#
#   broker-cli announce examples/announcement.example.yaml           (Rust)
#   pacod-broker announce examples/announcement.example.yaml         (Python, TypeScript)
#
# `broker-cli announce --check` runs the broker's own checks on the file and sends nothing.
ttl_s: 30
provider:
  name: local-ollama
  title: Workstation models
  summary: Models served by Ollama on a workstation with one RTX 4090.
  inventory:
    visibility: platform
    hardware:
      - { id: gpu, type: gpu, vendor: nvidia, model: RTX-4090, count: 1, memory_gb: 24 }
    software:
      - { id: ollama, kind: serving_engine, name: ollama, version: "0.5.7" }
resources:
  - key: qwen-coder
    kind: model
    name: qwen2.5-coder-32b
    summary: Qwen 2.5 Coder 32B, q4_k_m, on one RTX 4090.
    description: |
      A coding model behind Ollama's **OpenAI-compatible** endpoint. Best for completion and
      refactoring; two requests at a time.
    interfaces:
      - { protocol: openai-chat, url: "http://workstation.lan:11434/v1" }
    model: { family: qwen, context_window: 32768, quantisation: q4_k_m, parameters_b: 32 }
    capabilities: { tools: true, streaming: true }
    runs_on: { hardware: [gpu], software: [ollama] }
    pricing: { free: true }
    availability:
      capacity: { max_concurrency: 2 }
      latency: { ttft_ms: 450, ms_per_token: 25 }
      schedule:
        timezone: Europe/Sofia
        rules:
          # The workstation serves outside office hours and at weekends.
          - { weekdays: [mon, tue, wed, thu, fri], from_time: "18:00", to_time: "08:00" }
          - { weekdays: [sat, sun], from_time: "00:00", to_time: "24:00" }
    access: { visibility: platform }
