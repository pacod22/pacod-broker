[package]
name = "pacod-broker"
description = "The pacod-broker binary: registry with leases, discovery API, MCP endpoint, admin API, reputation, metrics."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pacod-broker"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
arc-swap.workspace = true
axum.workspace = true
base64.workspace = true
clap.workspace = true
futures-util.workspace = true
hex.workspace = true
http.workspace = true
jiff.workspace = true
libc.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
mimalloc.workspace = true
pacod-broker-index.workspace = true
pacod-broker-logging.workspace = true
pacod-broker-model.workspace = true
pacod-broker-reputation.workspace = true
pacod-id-authz.workspace = true
pacod-id-client.workspace = true
parking_lot.workspace = true
ring.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tower.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# The clients' end-to-end test runs against this broker.
pacod-broker-client.workspace = true
# The scenario suite runs against this crate's binary (tests/scenarios.rs).
pacod-broker-suite.workspace = true
tower = { workspace = true, features = ["util"] }
